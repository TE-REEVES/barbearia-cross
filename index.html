<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cross Barbearia | Central de Links</title>

  <meta
    name="description"
    content="Central de links da Cross Barbearia. Fale pelo WhatsApp, acesse o Instagram, TikTok e veja nossa localização no Google."
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="./assets/logo-cross.png"
  >

  <!-- Fonte -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- CSS principal -->
  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <main class="page-shell">

    <!-- Overlay para escurecer o background -->
    <div

      aria-hidden="true"

      aria-labelledby="page-title"
    >

      <div class="brand-logo">

        <img
          src="./assets/logo-cross.png"
          alt="Logo Cross Barbearia"

        <span class="brand-eyebrow">
          Barbearia

        <h1 id="page-title">
          Cross Barbearia

        <p>
          Seu estilo começa aqui.
        </p>

      </div>


      <!-- Links principais -->
      <nav
        class="links"
        aria-label="Links principais da Cross Barbearia"
      >

        <a

          href="https://wa.me/message/MUP362BFAWWSG1"

          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir Instagram da Cross Barbearia"
        >

          <span class="link-button__text">
            Nosso Instagram
          </span>

          <span
            class="link-button__icon"
            aria-hidden="true"
          >

            <svg viewBox="0 0 24 24">

              <path

          target="_blank"
          rel="noopener noreferrer"

        >

          href="https://share.google/A8yVEmgX2bZgB3wqV"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir Cross Barbearia no Google"
        >

          <span class="link-button__text">

            aria-hidden="true"

      <!-- Como chegar -->
      <a
        class="google-secondary"
        href="https://share.google/A8yVEmgX2bZgB3wqV"
        target="_blank"
        rel="noopener noreferrer"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"

          <path
            d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"

        </span>

      </a>


      <!-- Rodapé -->
      <footer class="footer">

        <span>
          Desenvolvido por
        </span>

        <a
          href="https://www.instagram.com/franztech_/"
          target="_blank"
          rel="noopener noreferrer"

          Franztech

</html>
