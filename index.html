<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cross Barbearia | Central de Links</title>

  <meta
    name="description"
    content="Central de links da Cross Barbearia. Fale pelo WhatsApp, acesse Instagram, TikTok, Google e copie a senha do Wi-Fi."
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <!-- ==========================================
       FAVICON
       ========================================== -->
  <link
    rel="icon"
    type="image/png"
    href="./assets/logo-cross.png"
  >

  <!-- ==========================================
       GOOGLE FONTS
       ========================================== -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./style.css"
  >

</head>


<body>

  <!-- ==========================================
       PÁGINA PRINCIPAL
       ========================================== -->

  <main class="page-shell">

    <!-- Overlay escuro aplicado sobre a foto -->
    <div
      class="background-overlay"
      aria-hidden="true"
    ></div>


    <!-- ========================================
         CONTEÚDO
         ======================================== -->

    <section
      class="link-card"
      aria-labelledby="page-title"
    >


      <!-- ======================================
           LOGO
           ====================================== -->

      <div class="brand-logo entrance entrance--logo">

        <img
          src="./assets/logo-cross.png"
          alt="Logo Cross Barbearia"
        >

      </div>


      <!-- ======================================
           IDENTIDADE
           ====================================== -->

      <div class="brand-copy entrance entrance--title">

        <span class="brand-eyebrow">
          Barbearia
        </span>


        <h1 id="page-title">
          Cross Barbearia
        </h1>


        <p>
          Seu estilo começa aqui.
        </p>

      </div>


      <!-- ======================================
           LINKS PRINCIPAIS
           ====================================== -->

      <nav
        class="links"
        aria-label="Links principais da Cross Barbearia"
      >


        <!-- ====================================
             WHATSAPP
             ==================================== -->

        <a
          class="link-button entrance entrance--button-1"
          href="https://wa.me/message/MUP362BFAWWSG1"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Falar com a Cross Barbearia pelo WhatsApp"
        >

          <span class="link-button__text">
            Fale pelo WhatsApp
          </span>


          <span
            class="link-button__icon"
            aria-hidden="true"
          >

            <svg viewBox="0 0 24 24">

              <path
                d="M12.04 2A9.84 9.84 0 0 0 3.6 16.9L2 22l5.23-1.54A9.94 9.94 0 1 0 12.04 2Zm0 17.94a8 8 0 0 1-4.08-1.11l-.3-.18-3.1.91.93-3.02-.2-.31a8.03 8.03 0 1 1 6.75 3.71Zm4.4-5.99c-.24-.12-1.43-.71-1.65-.79-.22-.08-.38-.12-.54.12-.16.24-.62.79-.76.95-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.93-1.19-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.79-.2-.47-.4-.41-.54-.42h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2 0 1.18.86 2.32.98 2.48.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.58.18 1.1.16 1.51.1.46-.07 1.43-.59 1.63-1.15.2-.57.2-1.05.14-1.15-.06-.1-.22-.16-.46-.28Z"
              />

            </svg>

          </span>

        </a>


        <!-- ====================================
             INSTAGRAM
             ==================================== -->

        <a
          class="link-button entrance entrance--button-2"
          href="https://www.instagram.com/cross.barbearia?dlrf=MWNpaHNrZjZlbjNrZg%3D%3D&utm_source=qr"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir Instagram da Cross Barbearia"
        >

          <span class="link-button__text">
            Nosso Instagram
          </span>


          <span
            class="link-button__icon"
            aria-hidden="true"
          >

            <svg viewBox="0 0 24 24">

              <path
                d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2Zm-.2 2A3.6 3.6 0 0 0 4 7.6v8.8A3.6 3.6 0 0 0 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6A3.6 3.6 0 0 0 16.4 4H7.6Zm9.65 1.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"
              />

            </svg>

          </span>

        </a>


        <!-- ====================================
             TIKTOK
             ==================================== -->

        <a
          class="link-button entrance entrance--button-3"
          href="https://www.tiktok.com/@cross.barbearia?_r=1&_t=ZS-9AmHKG9XRNC"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir TikTok da Cross Barbearia"
        >

          <span class="link-button__text">
            Nosso TikTok
          </span>


          <span
            class="link-button__icon"
            aria-hidden="true"
          >

            <svg viewBox="0 0 24 24">

              <path
                d="M16.6 3c.35 1.98 1.5 3.16 3.4 3.29v3.13c-1.1.11-2.07-.15-3.37-.95v5.85c0 7.43-8.1 9.75-11.36 4.42-2.1-3.45-.81-9.5 5.92-9.74v3.3c-.36.06-.74.15-1.1.27-1.06.35-1.67 1.01-1.91 1.95-.47 1.87 1.55 3.7 3.38 2.73 1.02-.54 1.27-1.42 1.27-2.55V3h3.77Z"
              />

            </svg>

          </span>

        </a>


        <!-- ====================================
             LOCALIZAÇÃO
             ==================================== -->

        <a
          class="link-button entrance entrance--button-4"
          href="https://share.google/A8yVEmgX2bZgB3wqV"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir localização da Cross Barbearia"
        >

          <span class="link-button__text">
            Como chegar
          </span>


          <span
            class="link-button__icon"
            aria-hidden="true"
          >

            <svg viewBox="0 0 24 24">

              <path
                d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"
              />

            </svg>

          </span>

        </a>


        <!-- ====================================
             AVALIAÇÃO GOOGLE
             ==================================== -->

        <a
          class="link-button entrance entrance--button-5"
          href="https://search.google.com/local/writereview?placeid=ChIJeUs715lFzpQRzFk0sRL5Y7Q"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Avaliar a Cross Barbearia no Google"
        >

          <span class="link-button__text">
            Avalie-nos no Google
          </span>


          <span
            class="link-button__icon"
            aria-hidden="true"
          >

            <svg viewBox="0 0 24 24">

              <path
                d="m12 2.5 2.93 5.94 6.56.95-4.75 4.63 1.12 6.54L12 17.47l-5.86 3.09 1.12-6.54-4.75-4.63 6.56-.95L12 2.5Z"
              />

            </svg>

          </span>

        </a>


        <!-- ====================================
             WI-FI
             ==================================== -->

        <button
          class="link-button entrance entrance--button-6"
          id="copyWifiButton"
          type="button"
          aria-label="Copiar senha do Wi-Fi"
        >

          <span class="link-button__text">
            Copiar senha do Wi-Fi
          </span>


          <span
            class="link-button__icon"
            aria-hidden="true"
          >

            <svg viewBox="0 0 24 24">

              <path
                d="M12 18.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm0-4.5c2.08 0 4 .69 5.54 1.86l-1.5 1.97A6.5 6.5 0 0 0 12 16.5c-1.52 0-2.92.52-4.04 1.33l-1.5-1.97A9.08 9.08 0 0 1 12 14Zm0-5c3.25 0 6.22 1.11 8.57 2.97l-1.53 1.94A11.3 11.3 0 0 0 12 11.5c-2.7 0-5.18.92-7.04 2.41l-1.53-1.94A13.8 13.8 0 0 1 12 9Zm0-5c4.4 0 8.44 1.5 11.65 4.02l-1.54 1.94A16.2 16.2 0 0 0 12 6.5c-3.86 0-7.4 1.3-10.11 3.46L.35 8.02A18.7 18.7 0 0 1 12 4Z"
              />

            </svg>

          </span>

        </button>

      </nav>


      <!-- Feedback após copiar Wi-Fi -->
      <div
        class="copy-feedback"
        id="copyFeedback"
        role="status"
        aria-live="polite"
      >
        Senha do Wi-Fi copiada!
      </div>


      <!-- ======================================
           RODAPÉ
           ====================================== -->

      <footer class="footer entrance entrance--footer">

        <span>
          Desenvolvido por
        </span>

        <a
          href="https://www.instagram.com/franztech_/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Franztech
        </a>

      </footer>

    </section>

  </main>


  <!-- JavaScript -->
  <script
    src="./script.js"
    defer
  ></script>

</body>

</html>
